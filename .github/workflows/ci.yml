name: BellaPelle
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: bellapelle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/bellapelle_test
      DATABASE_URL: mysql://root@127.0.0.1:3306/bellapelle_test
      APP_ORIGIN: http://127.0.0.1:3100
      TEST_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Senha temporária dos testes
        run: echo "TEST_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: HTTP e navegador com MySQL
        run: |
          npm start -- --port 3100 > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3100/api/health && break || sleep 1; done
          npm run test:api:clinic
          node tests/customer-http.mjs
          npm run test:e2e:admin
